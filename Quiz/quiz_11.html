<body>
    <script>

        function solution(arr){
            let answer = 0;
            let temp = [];
            
                arr.sort((a,b)=>{
                    if(a[1] === b[1]) return a[0] - b[0];
                    else return a[1] - b[1];
                });
                
                let et = 0;
                for(let x of arr){
                    if(x[0]>et){
                        answer++;
                        temp.push(x);
                        et = x[1];
                    }
                }

            return answer;
        }
        let arr = [[1,4],[2,3],[3,5],[4,6],[5,7]];
        //let arr = [[3,3],[1,3],[2,3]];
        console.log(solution(arr));

    </script>
