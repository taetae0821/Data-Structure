<html>
<head>
    <title>stack - 괄호안에 있는 문자만 출력</title>
</head>
<body>
    <script>
        function solution(s) {
            let answer="";
            let stack = [];

            for(let x of s) {
                // console.log(x);
                if(x===')') {
                    while(stack.pop() !== '(');
                }
                else stack.push(x);
            } // for

            // console.log(stack);
            answer = stack.join('');
            return answer;
        }
        let str = "(A(BC)D)EF(G(H)(IJ)K)LM(N)";
        console.log(solution(str))
    </script>
   
</body>
</html>
