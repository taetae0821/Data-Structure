<html>
<head>
    <title>이진수 변환 - 재귀함수</title>
</head>
<body>
    <script>
        function solution(n) {
            let answer="";
            function recursion(n) {
                if(n===0) return;       // 기저조건
                else {                                       
                    recursion(parseInt(n/2));          // 재귀호출
                    // console.log(n%2);  
                    answer += String(n%2);                  
                }
            } // recursion
            recursion(n);
            return answer;
        }
        console.log(solution(13))
    </script>
   
</body>
</html>
