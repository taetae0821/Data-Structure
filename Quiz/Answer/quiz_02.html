<html>
<head>
    <title>배열 - 보이는 학생 수</title>
</head>
<body>
    <script>
        function solution(arr) {
            let answer=1, max=arr[0];
            for(let i=1; i<arr.length; i++) {
                if(arr[i]>max) {
                    answer++;
                    max = arr[i];
                }        
            } // for           
            return answer;
        }
        let arr = [131,135, 148, 140, 145, 150, 150, 153];
        console.log(solution(arr))
    </script>
   
</body>
</html>
